# A pipeline is composed of independent jobs that run scripts, grouped into
# stages. Stages run in sequential order, but jobs within stages run in
# parallel. For more information, see:
# https://docs.gitlab.com/ee/ci/yaml/#stages
---
# Docker image info
#
# Using always pull policy by default so can reuse tags,
# replace with if-not-present if too demanding on runner
default:
  image:
    name: $CI_REGISTRY_IMAGE:mp_v1.29.0-with-deps
    pull_policy: ["always", "if-not-present"]
  tags:
    - docker

stages:
  - lint
  - build
  - test

####################################################
# LINT STAGE
####################################################

pre-commit:
  stage: lint
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    key: pre-commit-cache-$CI_COMMIT_REF_SLUG
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - pre-commit run --all-files

####################################################
# BUILD STAGE
####################################################

build:
  stage: build
  script:
    - echo "$PATH"
    - micropython --version
    - ls -l

####################################################
# TEST STAGE
####################################################

# Runs the unit tests by calling a python script that runs each of our test
# files
#
# Uses a custom LIB_PATHS environment variable containing the path of our
# modules to be inserted into sys.path. To avoid overwriting MICROPYPATH which
# will have default entries containing test dependencies which need to be in the
# path.

unittest:
  stage: test
  variables:
    # The path micropython will use for finding modules,
    # will contain own lib folder
    LIB_PATHS: "${CI_PROJECT_DIR}/src/lib"
  script:
    - echo "$LIB_PATHS"
    - micropython -v tools/run_tests.py

# A pipeline is composed of independent jobs that run scripts, grouped into
# stages. Stages run in sequential order, but jobs within stages run in
# parallel. For more information, see:
# https://docs.gitlab.com/ee/ci/yaml/#stages
---
default:
  image: $CI_REGISTRY_IMAGE:mp_v1.28.0-unmodified
  tags:
    - docker

stages:
  - lint
  - build
  - test

####################################################
# LINT STAGE
####################################################

pre-commit:
  stage: lint
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    key: pre-commit-cache-$CI_COMMIT_REF_SLUG
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - pip install -U micropython-esp32-stubs --target ${CI_PROJECT_DIR}/typings
    - pre-commit run --all-files

####################################################
# BUILD STAGE
####################################################

build:
  stage: build
  script:
    - echo "$PATH"
    - micropython --version
    - ls -l

####################################################
# TEST STAGE
####################################################

# Runs unit tests by calling 2 python scripts, one which sets up and fetch the
# required dependencies, and one which runs the tests.

# NOTE - currently I am setting the module paths manually in the second python
# script rather than using the MICROPYPATH environment variable.
# This is mainly to prevent any problems with the mip stuff but can be
# changed later.

# TODO - maybe add artefacts for test results


unittest:
  stage: test

  variables:
    # Path for the mip library files to download to
    MIP_LIBRARY_PATH: "${CI_PROJECT_DIR}/.mip/lib"
    # The path micropython will use for finding modules,
    # will contain mip library path and own lib
    LIB_PATHS: "${CI_PROJECT_DIR}/src/lib:${MIP_LIBRARY_PATH}"

  script:
    - echo "$LIB_PATHS"
    - micropython tools/setup_test_env.py
    - ls -la ${MIP_LIBRARY_PATH}  # Check worked
    - micropython -v tools/run_tests.py

  cache:
    key: mip-libraries-cache
    paths:
      - .mip/lib

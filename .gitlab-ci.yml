# A pipeline is composed of independent jobs that run scripts, grouped into
# stages. Stages run in sequential order, but jobs within stages run in
# parallel. For more information, see:
# https://docs.gitlab.com/ee/ci/yaml/#stages
---
# Docker image info
#
# Using always pull policy by default so can reuse tags,
# replace with if-not-present if too demanding on runner
default:
  image:
    name: $CI_REGISTRY_IMAGE:mp_v1.29.0-with-stubs
    pull_policy: "always"
  tags:
    - docker

stages:
  - lint
  - build
  - test

####################################################
# LINT STAGE
####################################################

pre-commit:
  stage: lint
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    key: pre-commit-cache-$CI_COMMIT_REF_SLUG
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - pre-commit run --all-files

####################################################
# BUILD STAGE
####################################################

build:
  stage: build
  script:
    - echo "$PATH"
    - micropython --version
    - ls -l

####################################################
# TEST STAGE
####################################################

# Runs the unit tests by calling a python script that runs each of our test
# files
#
# LIB_PATHS no longer needed as script resolves paths automatically

unittest:
  stage: test
  script:
    - micropython -v tools/run_tests.py

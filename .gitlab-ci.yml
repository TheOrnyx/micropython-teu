# A pipeline is composed of independent jobs that run scripts, grouped into
# stages. Stages run in sequential order, but jobs within stages run in
# parallel. For more information, see:
# https://docs.gitlab.com/ee/ci/yaml/#stages
---
default:
  image: $CI_REGISTRY_IMAGE:latest
  tags:
    - docker

stages:
  - lint
  - build-mp
  - build
  - test

####################################################
# LINT STAGE
####################################################

pre-commit:
  stage: lint
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    key: pre-commit-cache-$CI_COMMIT_REF_SLUG
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - pre-commit run --all-files


# Clone and build modified micropython
build-mp:
  stage: build-mp
  script:
    # TODO - make sure to clone the development branch
    # Large line so disabling yamlint check
    # yamllint disable-line rule:line-length
    - git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ecs.vuw.ac.nz/course-work/project489/2026/project/silouzaki/micropython.git
    - cd micropython/ports/unix
    - make -C ../../mpy-cross
    - make submodules
    # TODO - could maybe use make install?
    - make
    - ./build-standard/micropython -h
    - ./build-standard/micropython -c "print('hello, world')"

#  artifacts:
#    expose_as: "built-mp"
#    paths:
#      - micropython/
#  rules:
#    - changes:
#        - src/**/*

####################################################
# BUILD STAGE
####################################################

build:
  stage: build
  needs:
    - job: build-mp
      artifacts: true
  script:
    - echo "builddd"
    - ls -l

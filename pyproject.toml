# See the Python Packaging User Guide - Writing your pyproject.toml
# <https://packaging.python.org/en/latest/guides/writing-pyproject-toml>
# for more information.

[project]
name = "teu-doubles" # TEU (Testing ESP32 on UNIX), maybe change later
requires-python = ">=3.12"
version = "1.29.0.dev0"
dependencies = [
    "black (>=26.1.0,<27.0.0)",
    "esptool (>=5.2.0)",
    "gitlint (>=0.19.1,<0.20.0)",
    "mdformat-tables @ git+https://github.com/jamesquilty/mdformat-tables@v0.4.1-patched",
    "mdformat @ git+https://github.com/jamesquilty/mdformat@0.7.17-patched",
    "mpremote (==1.27.0)",
    "mpy-cross (==1.27.0.post2)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "rshell (>= 0.0.36)",
    "shellcheck-py (>= 0.11.0.1)",
    "yamllint (>=1.38.0,<2.0.0)",
]
authors = [
    {name = "Zaki Si-Lounis", email = "silouzaki@myvuw.ac.nz"},
]

[tool.black]
# Using slightly less than pylint max of 100
line-length = 98

# ------- Extra dev dependencies for local development
#
# For things like IDE completion and other helpful local tooling
#
# For tools that need the stubs to be installed in their own typings folder this can be done with
# pip install -U micropython-esp32-stubs --target typings

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",  # Just for IDE support
    "mypy>=2.1.0",
    "micropython-esp32-stubs==1.28.0.post4",  # For completion support
    "ruff>=0.16.2",
]

# Ruff config, for local use
[tool.ruff]
exclude = ["typings", ".venv",]
line-length = 100
builtins = ["const",]

[tool.ruff.lint]
select = [
       "E",
       "F",
       "B",
       "SIM",
       "PYI", # flake8-pyi - stub file specific checks
]

ignore = ["B904"]

# Pyright LSP config for stub support (just for local usage)
[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
typeshedPath = "typings/"
pythonPlatform = "Linux"
pythonVersion = "3.10"
reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "information"
reportOptionalContextManager = "none"  # Was having problems with unittest.assertRaises context
reportArgumentType = "warning"
autoImportCompletions = false

# Local mypy config
[tool.mypy]
platform = "linux"
python_version = "3.10"
mypy_path = "typings"  # To give me warnings if using something not in the mpy stdlib
custom_typeshed_dir = "typings"
files = "*.py"
exclude = [
    "typings[\\/].*", # TOML basic string
]

ignore_missing_imports = true
follow_imports = "silent"
follow_imports_for_stubs = true
# no_site_packages = true
check_untyped_defs = true
